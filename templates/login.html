<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crossbin — Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='crossbin.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='files/crossbin.css') }}">
</head>
<body>
{% include "navbar.html" %}
<div class="db-page">
    <div class="db-auth-wrap">
        <div class="db-auth-box">
            <h1 class="db-auth-title">Login</h1>
            {% if error %}
            <div class="db-auth-error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="db-auth-field">
                    <label>Username</label>
                    <input type="text" name="username" autocomplete="username" autofocus required>
                </div>
                <div class="db-auth-field">
                    <label>Password</label>
                    <input type="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="db-btn green db-auth-submit">Login</button>
            </form>
            <div class="db-auth-links">
                No account? <a href="{{ url_for('register') }}">Register</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
